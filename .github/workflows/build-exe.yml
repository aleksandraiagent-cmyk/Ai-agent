name: Сборка TerminalApp.exe

on:
  workflow_dispatch:
  push:
    branches: [claude/app-from-prompt-a6c2y2]
    paths: ["terminal_app.py", "web/**", "requirements.txt", ".github/workflows/build-exe.yml"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas anthropic pyinstaller
      - name: Сборка
        run: >
          pyinstaller --onefile --name TerminalApp --add-data "web;web"
          --collect-all yfinance --collect-all curl_cffi --collect-all anthropic
          terminal_app.py
      - name: Проверка запуска
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TerminalApp.exe -ArgumentList "--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/status
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200 -or $page.Content -notmatch "terminal") { throw "exe не отвечает" }
          Write-Output "OK: сервер отвечает"
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalApp-windows
          path: dist/TerminalApp.exe
          retention-days: 90
