name: Сборка TerminalApp.exe

on:
  workflow_dispatch:
  push:
    branches: [claude/app-from-prompt-a6c2y2]
    paths: ["terminal_app.py", "*.bat", "app/**", "tools/**", "requirements.txt", ".github/workflows/build-exe.yml"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas anthropic pyinstaller
      - name: Проверка формата данных на живом Yahoo
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_format.py
      - name: Сборка
        run: >
          pyinstaller --onefile --name TerminalApp --add-data "app;app"
          --collect-all yfinance --collect-all curl_cffi --collect-all anthropic
          terminal_app.py
      - name: Проверка запуска exe
        shell: pwsh
        run: |
          $env:TERMINAL_DATA_DIR = "$env:RUNNER_TEMP\tdata"
          $p = Start-Process -FilePath dist\TerminalApp.exe -ArgumentList "--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 15
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/
          $idx = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/data/index.json
          $r = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body '{"trigger_id":"trig_017W1ytcraAtywN9U9kUV1MV","text":"\u0422\u0418\u041a\u0415\u0420: AAPL"}' http://127.0.0.1:8799/api/trigger
          Start-Sleep -Seconds 60
          $doc = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/data/AAPL.json).Content | ConvertFrom-Json
          Stop-Process -Id $p.Id -Force
          if ($page.Content -notmatch "window.LOCAL_APP=true") { throw "страница терминала не отдаётся" }
          if ($idx.Content -notmatch "AAPL") { throw "нет данных index.json" }
          $age = [int][double]::Parse((Get-Date -UFormat %s)) - $doc.updated
          Write-Output "AAPL обновлён $age с назад, цена $($doc.quote.price)"
          if ($age -gt 300) { throw "кнопка «Обновить» не обновила AAPL" }
          Write-Output "OK: exe работает, обновление по кнопке проходит"
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalApp-windows
          path: |
            dist/TerminalApp.exe
            Запуск для iPhone.bat
          retention-days: 90
